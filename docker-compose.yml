services:
  db:
    image: mariadb:11
    restart: "no"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build: .
    image: wp-dev
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);
    volumes:
      # WordPress core + wp-config.php live in a Docker-managed volume (always correct permissions)
      - wp_core:/var/www/html
      # Your code: themes, plugins, mu-plugins, uploads (editable on your computer)
      - ./wp-content:/var/www/html/wp-content
      # Custom PHP / OPcache settings
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini

  phpmyadmin:
    image: phpmyadmin:latest
    restart: "no"
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 128M

  # WP-CLI, only runs when you call it, e.g.:
  #   docker compose run --rm wpcli plugin list
  wpcli:
    build: .
    image: wp-dev
    profiles: ["tools"]
    entrypoint: ["wp"]
    user: www-data
    working_dir: /var/www/html
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini

volumes:
  db_data:
  wp_core:
